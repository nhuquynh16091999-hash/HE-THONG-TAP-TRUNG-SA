<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ANTALO — mất kết nối</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FFFFEF; color: #2A2620; padding: 24px; box-sizing: border-box; text-align: center;
        }
        @media (prefers-color-scheme: dark) { body { background: #131210; color: #EDEAE0; } }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { font-size: 20px; margin: 18px 0 6px; }
        p { margin: 0 0 20px; opacity: .75; font-size: 15px; line-height: 1.5; }
        button {
            border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
            color: #fff; background: linear-gradient(90deg, #F97316, #EF4444); cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icon-192.png" alt="ANTALO">
        <h1>Mất kết nối mạng</h1>
        <p>Dashboard cần mạng để lấy số mới nhất.<br>Kiểm tra wifi / 4G rồi thử lại.</p>
        <button onclick="location.reload()">Thử lại</button>
    </main>
</body>
</html>
