# ANTALO dashboard qua HTTPS — https://139.180.131.21 (cổng 443 mặc định).
#
# Sỹ Anh yêu cầu 06/10/2026: cài dashboard thành app trên điện thoại / máy tính (PWA). Trình
# duyệt chỉ cho cài app khi trang chạy HTTPS, nên nginx đứng trước Next (127.0.0.1:3000).
# Mật khẩu đăng nhập cũng thôi đi qua mạng dạng chữ trơn như ở http://…:3000.
#
# CHỨNG CHỈ: dùng CHUNG chứng chỉ Let's Encrypt cấp cho chính địa chỉ IP (hồ sơ "shortlived",
# hạn 6 ngày) mà cấu hình AI Sale cùng máy đã có — certbot-renew.timer gia hạn 2 lần/ngày qua
# cổng 80 (aisale-acme.conf), hook /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh nạp
# lại nginx. Bắn bot (banbot.conf, cổng 8447) cũng dùng chung. File này KHÔNG đụng hai cấu
# hình kia. Nếu một ngày máy chủ bỏ AI Sale/certbot thì chứng chỉ hết hạn sau ≤ 6 ngày —
# soát: openssl x509 -in /etc/letsencrypt/live/139.180.131.21/fullchain.pem -noout -dates
#
# Cài: ops/deploy/vps-setup.sh tự chép file này vào /etc/nginx/conf.d/talpha-https.conf
# (chỉ khi có nginx + chứng chỉ, và chỉ nạp lại khi `nginx -t` qua — hỏng cú pháp thì giữ
# nguyên cấu hình cũ, không kéo sập Bắn bot).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/139.180.131.21/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.180.131.21/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tải lên sao kê NAZA (xlsx), file chi phí TKQC + sao kê thẻ (xlsx/pdf), bảng đơn đối tác.
    # Mặc định nginx chỉ 1 MB — thiếu dòng này là bấm tải file nào cũng lỗi 413.
    client_max_body_size 50m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # NextAuth (AUTH_TRUST_HOST=true) đọc dòng này để biết trang đang chạy HTTPS và đặt
        # cookie đăng nhập loại Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # "Tra WeShip" / "Đồng bộ 17TRACK" bấm trên màn có thể chạy vài phút.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
