  - 3PL: iMile (SA, AE, QA, OM) + PostaPlus (KW) + Aramex (BH)
  - Ngành: Trang sức + Mỹ phẩm, target phụ nữ Philippines ở GCC
  - 27 SKU (trang sức + skincare)
  - POS giá ÷100, doanh thu lấy từ COD/money_to_collect
