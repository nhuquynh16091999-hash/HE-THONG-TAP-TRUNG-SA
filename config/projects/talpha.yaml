# ─── 4. POS / ORDER MANAGEMENT ───
pos_system: poscake

# Mỗi nước một shop. CHỈ khai shop ĐÃ có key — khai shop với api_key trống là mỗi lần mở
# tab Kho hay Ads Command Center lại gọi POS rồi chờ timeout (đã dính với sáu shop GCC,
# gỡ 11/09/2026). `name` phải là tên nước trong talpha_rules.json → markets.
# Danh sách nước thật nằm ở config/talpha_rules.json → markets; file này phải khớp.
poscake:
  shops:
    - name: "Taiwan"
      api_url: "https://pos.pages.fm/api/v1"
      api_key: "${TALPHA_POSCAKE_TW_KEY}"               # ⚠️ Giá trị thật nằm trong .env
      shop_id: "1022091930"  # "TAIWAN SỸ ANH" — đổi 14/09/2026 từ shop cũ 408074608.
                             # Mỗi shop một key: đổi shop phải đổi TALPHA_POSCAKE_TW_KEY,
                             # key cũ gọi shop mới trả "Cửa hàng không tồn tại"
    - name: "Singapore"
      api_url: "https://pos.pages.fm/api/v1"
      api_key: "${TALPHA_POSCAKE_SG_KEY}"               # ⚠️ Giá trị thật nằm trong .env
      shop_id: "715135541"   # nối 15/09/2026 — chỉ tính đơn từ 14/09 (xem talpha_rules.json)
    - name: "UAE"
      api_url: "https://pos.pages.fm/api/v1"
      api_key: "${TALPHA_POSCAKE_AE_KEY}"               # ⚠️ Giá trị thật nằm trong .env
      shop_id: "101085629"   # nối 15/09/2026 — tỷ giá 7.000đ/AED, chưa 3PL

# ─── 5. PANCAKE CRM ───
pancake:
  api_url: "https://pages.fm/api/v1"
  api_token: "${TALPHA_PANCAKE_API_TOKEN}"              # ⚠️ Actual value in .env
  page_ids:
    - ""                          # CẦN BỔ SUNG nếu có

# ─── 6–7. 3PL VÀ THỊ TRƯỜNG ───
# Đã chuyển sang config/talpha_rules.json → markets (nước, tiền, tỷ giá, trạng thái) và
# shipping_fees (bảng phí 3PL). Khối fulfillment/markets của sáu nước GCC từng nằm ở đây
# (iMile, Aramex, PostaPlus) — không code nào đọc, dễ bị tưởng là cấu hình thật, gỡ
# 15/09/2026 khi mở lại Singapore và UAE.

