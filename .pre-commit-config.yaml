repos:
  # ─── Standard hygiene hooks ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      # KHÔNG chặn commit vào main: đội này làm thẳng trên main, không dùng PR.
      # Bật lại nếu chuyển sang quy trình nhánh + PR.

  # ─── Python: flake8 (critical errors + undefined names) ──────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --select=E9,F63,F7,F82,F401   # syntax errors + undefined + unused import
          - --exclude=venv,.venv,__pycache__,migrations
        files: ^(sync|ops|scripts|sql|tests)/.*\.py$

  # ─── Secrets scanner ─────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (\.env\.example|.*_TEMPLATE_.*)

  # ─── Kiểm tra riêng của dự án ─────────────────────────────────────────
  - repo: local
    hooks:
      # 1. Độ dài file: 300 dòng Python, 500 dòng TypeScript.
      # Nhiều file cốt lõi đang vượt (talpha_sync.py 786, cod-recon-tab.tsx 836) —
      # tách chúng là việc riêng. Hook này để chặn file MỚI phình ra.
      - id: check-file-length
        name: "Độ dài file (300 Python / 500 TS)"
        language: python
        entry: python scripts/hooks/check_file_length.py
        types_or: [python, ts, tsx]
        pass_filenames: true

      # 2. Không commit file .env thật
      - id: block-env-files
        name: "Chặn file .env"
        language: fail
        entry: "Không được commit .env files! Dùng .env.example thay thế."
        files: ^\.env(\.\w+)?$
        exclude: ^\.env\.example$
