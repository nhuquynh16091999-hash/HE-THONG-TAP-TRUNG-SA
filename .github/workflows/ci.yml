name: TALPHA CI — lint · bảo mật · kiểm thử

# Viết lại 11/09/2026. Bản trước là "FAOS CI": mọi job đều trỏ vào `faos_brain/`
# và `api/` — hai thư mục KHÔNG tồn tại trong repo này. `flake8 faos_brain/` trả
# "No such file or directory" nên CI hỏng ở mọi lần push, và cổng cuối `ci-gate`
# luôn đỏ. CI đỏ thường trực thì không ai còn đọc nó nữa.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════
  # Python — lỗi cú pháp, tên chưa định nghĩa, import thừa
  # ═══════════════════════════════════════════════════════
  python-lint:
    name: "🐍 Python Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài flake8
        run: pip install flake8
      - name: Flake8 — lỗi nghiêm trọng + tên chưa định nghĩa
        run: |
          flake8 sync/ ops/ scripts/ sql/ tests/ \
            --max-line-length=120 \
            --select=E9,F63,F7,F82,F401 \
            --exclude=venv,.venv,__pycache__ \
            --count --show-source --statistics

  # ═══════════════════════════════════════════════════════
  # Độ dài file — CẢNH BÁO, không chặn merge
  # ═══════════════════════════════════════════════════════
  # Nhiều file cốt lõi đang vượt ngưỡng (talpha_sync.py 786 dòng, cod-recon-tab.tsx
  # 836). Tách chúng là việc riêng, không phải điều kiện để merge một sửa đổi khác.
  # Một kiểm tra LÚC NÀO CŨNG đỏ thì tệ hơn là không có kiểm tra nào.
  file-length:
    name: "📏 Độ dài file (cảnh báo)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python (ngưỡng 300 dòng)
        run: python scripts/hooks/check_file_length.py $(git ls-files 'sync/**/*.py' 'ops/**/*.py' 'scripts/**/*.py')
      - name: TypeScript (ngưỡng 500 dòng)
        run: python scripts/hooks/check_file_length.py $(git ls-files 'dashboard-ui/src/**/*.ts' 'dashboard-ui/src/**/*.tsx')

  # ═══════════════════════════════════════════════════════
  # Bảo mật — bandit + quét khoá ghi cứng
  # ═══════════════════════════════════════════════════════
  security:
    name: "🔐 Quét bảo mật"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài bandit
        run: pip install bandit
      - name: Bandit
        run: bandit -r sync/ ops/ scripts/ sql/ -ll -ii --skip B101
      - name: Không có khoá ghi cứng trong code
        run: |
          ! git grep -lE \
            '(app_secret|access_token|api_key|api_token|password)\s*[:=]\s*"[a-zA-Z0-9]{20,}"' \
            -- '*.py' '*.ts' '*.tsx' '*.yaml' '*.json' \
            ':!*.example' ':!.env.example' ':!*.secrets.baseline'

  # ═══════════════════════════════════════════════════════
  # Kiểm thử rule nghiệp vụ (Python)
  # ═══════════════════════════════════════════════════════
  python-tests:
    name: "🧪 Kiểm thử rule nghiệp vụ"
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cài phụ thuộc
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          ENV: test
          BQ_PROJECT_ID: test-project
          BQ_DATASET: test_dataset

  # ═══════════════════════════════════════════════════════
  # Dashboard — kiểu, lint, và kiểm thử logic đối soát
  # ═══════════════════════════════════════════════════════
  dashboard-checks:
    name: "⚛️ Dashboard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Cài phụ thuộc
        working-directory: dashboard-ui
        run: npm ci
      - name: Kiểm kiểu TypeScript
        working-directory: dashboard-ui
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: dashboard-ui
        # `next lint` đã bị Next 16 bỏ; cấu hình phẳng ở eslint.config.mjs.
        # Chặn theo LỖI, không theo cảnh báo — repo còn 154 cảnh báo `any` là nợ
        # kiểu có chủ đích, ghi rõ lý do trong chính file cấu hình.
        run: npm run lint
      - name: Kiểm thử logic đối soát
        working-directory: dashboard-ui
        run: npm test

  # ═══════════════════════════════════════════════════════
  # Cổng cuối — mọi kiểm tra CHẶN đều phải xanh
  # ═══════════════════════════════════════════════════════
  ci-gate:
    name: "✅ Cổng CI"
    runs-on: ubuntu-latest
    needs: [python-lint, security, python-tests, dashboard-checks]
    if: always()
    steps:
      - name: Kiểm mọi job
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Có kiểm tra thất bại — không merge."
            exit 1
          fi
          echo "✅ Mọi kiểm tra đã qua."
